name: Tests

# 触发：PR / 手动 / 每日 cron
# 不用 push 因为 sheldonlidev 被 shadow ban
on:
  pull_request:
    # 主分支 2026-09-05 由 master 改名 main（GitHub 預設分支同日切換）。
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC 错开 web 项目

jobs:
  python-tests:
    name: pytest (book_index_manager)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install -e .
          pip install pytest
      - name: Run pytest
        run: pytest tests/ -v

  ui-unit:
    name: vitest (ui/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Test
        working-directory: ui
        run: npm test

  # 阅读器版式护栏（真 Chromium，overview#526；Ella 的 ui/tests/layout，bim#185）。
  # 几何断言（行首无空位、抬头字不偏移、去空白前后画布尺寸不同），不做截图像素比对，所以与 runner 字体基本无关。
  # 先作为独立 job、不设必过；跑稳几次再决定要不要设为必过。第一次在 Actions runner 上跑：
  # 若因字体让容差不稳，把失败日志贴 #526，由 ui 侧调 harness，不要放宽断言。
  ui-layout:
    name: layout (ui/, real Chromium)
    # 钉 24.04：ubuntu-latest 换成 26.04 后 Playwright 1.59 装不上 Chromium（"does not support chromium on ubuntu26.04-x64"，10-24）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Install
        working-directory: ui
        run: npm ci
      - name: Install Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Layout guard
        working-directory: ui
        timeout-minutes: 8
        run: npm run test:layout
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-layout-report
          path: |
            ui/test-results
            ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7
