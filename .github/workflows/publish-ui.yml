name: Publish book-index-ui

# 手动触发（Actions 页「Run workflow」，或 API workflow_dispatch）。
# 不用 push/tag 触发：见 test.yml 注，push 事件在本仓不可靠。
#
# 走 npm Trusted Publishing（OIDC）：不存任何 npm token。
# 预发布：dev 上把 ui/package.json 的 version 写成 0.66.0-rc.N，从 dev 分支 Run workflow（tag 留空即发 next）。
# 前提：npmjs.com → book-index-ui → Settings → Trusted Publisher 里
# 登记 GitHub Actions：open-guji / book-index-manager / publish-ui.yml。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只跑测试与打包，不真发（npm publish --dry-run）'
        type: boolean
        default: false
      tag:
        description: 'npm dist-tag。留空 = 自动：版本号带 -（如 0.66.0-rc.1）发 next，不动 latest；正式版发 latest。也可手填（如 next、beta）'
        type: string
        default: ''

permissions:
  id-token: write   # OIDC，Trusted Publishing 必需
  contents: read

concurrency:
  group: publish-ui
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: npm ≥ 11.5.1（Trusted Publishing 需要）
        run: npm install -g npm@latest && npm --version

      - name: 版本不得已在 npm 上
        run: |
          V=$(node -p "require('./package.json').version")
          echo "package.json version: $V"
          if npm view "book-index-ui@$V" version >/dev/null 2>&1; then
            echo "::error::book-index-ui@$V 已发布过，先 bump ui/package.json 的 version"
            exit 1
          fi

      # dist-tag：预发布版本绝不能占 latest，否则所有 `npm i book-index-ui` 的人都会拿到 rc。
      - name: 决定 dist-tag
        id: tag
        env:
          IN_TAG: ${{ inputs.tag }}
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="$IN_TAG"
          if [ -z "$TAG" ]; then
            case "$V" in *-*) TAG=next ;; *) TAG=latest ;; esac
          fi
          if [ "$TAG" = "latest" ]; then
            case "$V" in *-*) echo "::error::预发布版本 $V 不能发到 latest，请用 tag=next"; exit 1 ;; esac
          fi
          case "$TAG" in *[!A-Za-z0-9._-]*) echo "::error::非法 tag: $TAG"; exit 1 ;; esac
          echo "version=$V tag=$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build:lib
      - name: 包内容
        run: npm pack --dry-run

      - name: Publish
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run --ignore-scripts --tag "${{ steps.tag.outputs.tag }}"
          else
            npm publish --ignore-scripts --tag "${{ steps.tag.outputs.tag }}"
          fi
      # --ignore-scripts：上面已 build 过，避免 prepublishOnly 重复构建

      - name: 核对 registry
        if: ${{ !inputs.dry_run }}
        run: |
          V=$(node -p "require('./package.json').version")
          # registry 回显常滞后 1 分钟以上（09-26 首发实测约 75 秒），等到 5 分钟
          for i in $(seq 1 30); do
            got=$(npm view "book-index-ui@$V" version --prefer-online 2>/dev/null || true)
            [ "$got" = "$V" ] && { echo "registry 已见 $V（第 $i 次）"; exit 0; }
            sleep 10
          done
          echo "::error::publish 后 5 分钟内 registry 仍查不到 $V"; exit 1
